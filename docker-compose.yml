services:
  database:
    image: postgis/postgis:16-3.4
    container_name: evacuapp-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: evacuapp
      POSTGRES_USER: evacuapp_user
      POSTGRES_PASSWORD: evacuapp_password
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./docker/init-postgis.sql:/docker-entrypoint-initdb.d/init-postgis.sql

  ml-service:
    build: ./ml_service
    container_name: evacuapp-ml
    restart: unless-stopped
    ports:
      - "8001:8001"

volumes:
  postgis_data:
